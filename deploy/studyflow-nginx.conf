# 学迹 StudyFlow - Nginx 配置
# 使用方法：上传到服务器 /etc/nginx/conf.d/studyflow.conf 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    client_max_body_size 5m;
    server_name _;   # 有域名时替换为你的域名

    # 前端静态文件
    root /var/www/studyflow/dist;
    index index.html;

    # 单页应用路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # gzip 压缩(前端主包约 400KB gzip 后)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 反向代理到 FastAPI 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
